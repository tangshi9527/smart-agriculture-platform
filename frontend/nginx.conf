server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：未命中静态资源时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 与 WebSocket 代理
    location /api/      { proxy_pass http://app:8080; }
    location /auth/     { proxy_pass http://app:8080; }
    location /simulator/ { proxy_pass http://app:8080; }
    location /h2-console/ { proxy_pass http://app:8080; }

    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
